name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    # macOS minutes count 10x on private repos: the private staging repo skips this job and the release
    # run proves macOS with a local bare-PATH tests/run instead. Public repos run it for free.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: ./tests/run
      - name: Privacy check
        # CI has no maintainer private list; generic patterns still run.
        run: ./scripts/privacy-check .

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run tests
        run: ./tests/run
      - name: Privacy check
        # CI has no maintainer private list; generic patterns still run.
        run: ./scripts/privacy-check .
